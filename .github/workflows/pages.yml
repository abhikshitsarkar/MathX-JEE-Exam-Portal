# Builds the website and publishes it on GitHub Pages.
# Set these in the repository: Settings → Secrets and variables → Actions → Variables
#   NEON_AUTH_URL, NEON_DATA_API_URL, API_URL   (public values, not secrets)
name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_NEON_AUTH_URL: ${{ vars.NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.NEON_DATA_API_URL }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_APP_NAME: ${{ vars.APP_NAME || 'MathX Test Series' }}
        run: |
          npx vite build
          # GitHub Pages has no SPA rewrites: serve the app for unknown paths too
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
